<!-- Fluent Emoji Flat "bank" (MIT) — BocaSoft + profundidad -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" aria-hidden="true">
  <defs>
    <linearGradient id="side" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a3d72"/>
      <stop offset="100%" stop-color="#0d4580"/>
    </linearGradient>
    <linearGradient id="front" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#3d94dc"/>
      <stop offset="55%" stop-color="#1a5fb4"/>
      <stop offset="100%" stop-color="#134a9e"/>
    </linearGradient>
    <linearGradient id="roof" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7eb8ef"/>
      <stop offset="100%" stop-color="#4a9ae8"/>
    </linearGradient>
    <linearGradient id="steps" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e6bb8"/>
      <stop offset="100%" stop-color="#0f4a94"/>
    </linearGradient>
    <linearGradient id="door" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#134a9e"/>
      <stop offset="100%" stop-color="#082d5c"/>
    </linearGradient>
    <filter id="buildingShadow" x="-15%" y="-10%" width="130%" height="130%">
