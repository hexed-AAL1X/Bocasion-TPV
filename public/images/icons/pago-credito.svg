    </filter>
    <filter id="groundBlur" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="0.65"/>
    </filter>
  </defs>
  <!-- Sombra en el suelo -->
  <ellipse cx="16" cy="28.8" rx="11.5" ry="2.1" fill="#062849" opacity="0.22" filter="url(#groundBlur)"/>
