name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            args: --linux AppImage tar.xz
          - os: windows-latest
            args: --win nsis portable
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Preparar config.env para la app instalada
        env:
          MSSQL_PROFILE: dev
          MSSQL_PROFILES: ${{ secrets.MSSQL_PROFILES }}
          MSSQL_DEV_HOST: ${{ secrets.MSSQL_DEV_HOST }}
          MSSQL_DEV_HOST_FALLBACK: ${{ secrets.MSSQL_DEV_HOST_FALLBACK }}
          MSSQL_DEV_PORT: ${{ secrets.MSSQL_DEV_PORT }}
          MSSQL_DEV_DATABASE: ${{ secrets.MSSQL_DEV_DATABASE }}
          MSSQL_DEV_AUTH: ${{ secrets.MSSQL_DEV_AUTH }}
          MSSQL_DEV_DOMAIN: ${{ secrets.MSSQL_DEV_DOMAIN }}
          MSSQL_DEV_USER: ${{ secrets.MSSQL_DEV_USER }}
          MSSQL_DEV_PASSWORD: ${{ secrets.MSSQL_DEV_PASSWORD }}
          MSSQL_PROD_HOST: ${{ secrets.MSSQL_PROD_HOST }}
          MSSQL_PROD_PORT: ${{ secrets.MSSQL_PROD_PORT }}
          MSSQL_PROD_DATABASE: ${{ secrets.MSSQL_PROD_DATABASE }}
          MSSQL_PROD_AUTH: ${{ secrets.MSSQL_PROD_AUTH }}
          MSSQL_PROD_USER: ${{ secrets.MSSQL_PROD_USER }}
          MSSQL_PROD_PASSWORD: ${{ secrets.MSSQL_PROD_PASSWORD }}
          VITE_API_BASE_URL: ${{ secrets.VITE_API_BASE_URL }}
          APISPERU_TOKEN: ${{ secrets.APISPERU_TOKEN }}
          RUCPE_API_KEY: ${{ secrets.RUCPE_API_KEY }}
        run: node scripts/prepare-config-env.cjs
      - name: Publicar instaladores en GitHub Releases
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          npm run build
          npx electron-builder ${{ matrix.args }} --publish always
      - name: Copiar lanzador Linux
        if: runner.os == 'Linux'
        run: |
          cp -f scripts/run-intranet-ventas.sh release/Intranet-Ventas.sh || true
          chmod +x release/Intranet-Ventas.sh release/*.AppImage 2>/dev/null || true
          shopt -s nullglob
          for f in release/*.AppImage; do
            cp -f "$f" release/Intranet-Ventas.AppImage
            break
          done
