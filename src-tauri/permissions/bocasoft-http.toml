[[permission]]
identifier = "allow-get-platform"
description = "Permite leer la plataforma del SO"
commands.allow = ["get_platform"]

[[permission]]
identifier = "allow-fetch-json-url"
description = "Permite fetch JSON a hosts allowlist (BCRP, clima, RUCPE, API DNI)"
commands.allow = ["fetch_json_url"]

[[permission]]
identifier = "allow-lookup-identity"
description = "Permite consultar DNI/RUC por HTTP nativo"
commands.allow = ["lookup_identity"]

[[permission]]
identifier = "allow-warmup-http"
description = "Permite precalentar conexiones TLS a APIs externas"
commands.allow = ["warmup_http"]

[[permission]]
identifier = "allow-list-nava-docs"
description = "Permite listar facturas y boletas desde SQL Server (Nava)"
commands.allow = ["list_nava_docs"]
